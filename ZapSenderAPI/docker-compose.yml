version: '3.8'

services:
  # ZapSenderAPI - WhatsApp API Server
  zapsender-api:
    build: .
    container_name: zapsender-api
    ports:
      - "8080:8080"
      - "3000:3000" # WebSocket
    environment:
      - SERVER_PORT=8080
      - CLIENT_NAME=ZapSenderAPI
      - GLOBAL_API_KEY=zapsender-secret-key-orange-black
      - DATABASE_URL=sqlite:///data/instances.db
      - WEBHOOK_CONCURRENCY=10
    volumes:
      - ./data:/app/data
      - ./sessions:/app/sessions
    restart: unless-stopped
    networks:
      - zapsender-network

  # MinIO for media storage (optional)
  minio:
    image: minio/minio:latest
    container_name: zapsender-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    restart: unless-stopped
    networks:
      - zapsender-network

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: zapsender-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - zapsender-network

volumes:
  minio-data:
  redis-data:

networks:
  zapsender-network:
    driver: bridge